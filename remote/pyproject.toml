[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-fencing-remote"
version = "0.1.0"
description = "GPIO button remote for the LeRobot fencing drill"
requires-python = ">=3.10"
dependencies = ["gpiozero>=2.0.1,<3.0.0"]

[project.scripts]
fencing-remote = "fencing_remote.client:main"

[tool.setuptools.packages.find]
where = ["src"]
